[package]
name = "swe-grep-indexer"
version = "0.1.0"
edition = "2024"
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
ignore = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread"] }
tantivy = { version = "0.22.1", default-features = false, features = ["lz4-compression", "mmap"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
