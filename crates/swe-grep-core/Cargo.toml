[package]
name = "swe-grep"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs", "signal"] }
futures = "0.3"
swe-grep-indexer = { path = "../swe-grep-indexer", optional = true }
axum = { version = "0.7", features = ["macros", "json"] }
hyper = { version = "1.3", features = ["server", "http1"] }
tokio-stream = "0.1"
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
opentelemetry = { version = "0.22", features = ["metrics"] }
opentelemetry_sdk = { version = "0.22", features = ["metrics"] }
opentelemetry-prometheus = "0.15"
prometheus = "0.13"
# Speed optimizations
bytecount = "0.6"
dashmap = "6.0"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
lru = "0.12"
memmap2 = "0.9"
rayon = "1.10"
simd-json = "0.13"
ignore = "0.4"
globset = "0.4"
toml = "0.8"
strsim = "0.11"
regex = "1.11"
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

[features]
default = []
indexing = ["swe-grep-indexer"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3"
